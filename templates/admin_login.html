{% extends 'base.html' %}

{% block title %}Admin Portal – NoticeShield{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-dark text-info fs-2 mb-2 shadow">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Administrator Portal</h3>
                    <p class="text-muted small">
                        Sign in to issue, digitally sign, or revoke official university circulars.
                    </p>
                </div>

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary small">Administrator Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary small">Secure Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary-custom py-2.5">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter Dashboard
                        </button>
                    </div>

                    <div class="p-3 bg-light rounded-3 text-center border">
                        <span class="text-muted small d-block mb-1">
                            <i class="bi bi-info-circle text-info me-1"></i> <strong>Hackathon Demo Credentials:</strong>
                        </span>
                        <code class="text-dark small">Username: <strong>admin</strong> | Password: <strong>admin123</strong></code>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
